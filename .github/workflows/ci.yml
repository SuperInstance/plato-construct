name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (HTML validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tidy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tidy
      - name: Validate HTML files
        run: |
          for f in *.html; do
            echo "Checking $f"
            tidy -q -e "$f"
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: |
          errors=0
          for f in *.html; do
            grep -oP 'href="[^"]*"' "$f" | while read link; do
              target=$(echo "$link" | sed 's/href="//;s/"//')
              if [[ "$target" == http* ]]; then continue; fi
              if [[ "$target" == \#* ]]; then continue; fi
              if [ ! -f "$target" ]; then
                echo "Broken link in $f: $target"
                errors=$((errors+1))
              fi
            done
          done
          exit $errors

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Minify HTML files
        run: |
          mkdir -p dist
          for f in *.html; do
            cp "$f" "dist/$f"
          done
          echo "HTML files copied to dist/"
